[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.52.4",
    "webtwin-core",
]

[tool.uv.sources]
webtwin-core = { path = "../../python/webtwin_core", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
kg = [
    "neo4j>=5.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
