<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SPA S1 — Soft Route Draft</title>
    <style>
      body { font-family: Georgia, serif; margin: 0; background: linear-gradient(160deg, #e8f0ea, #f7f3e8); min-height: 100vh; }
      nav { display: flex; gap: 1rem; padding: 1rem 1.5rem; background: rgba(20,40,30,.9); }
      nav a { color: #e8f0ea; text-decoration: none; }
      main { padding: 2rem; max-width: 40rem; }
      .hidden { display: none; }
      label { display: block; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <div id="root">
      <nav>
        <a href="#/form" data-testid="nav-form">Form</a>
        <a href="#/about" data-testid="nav-about">About</a>
      </nav>
      <main id="view"></main>
    </div>
    <script>
      const draft = { notes: "" };
      function render() {
        const hash = location.hash || "#/form";
        const view = document.getElementById("view");
        if (hash === "#/about") {
          view.innerHTML = `<h1>About</h1><p>In-app soft route — draft must survive.</p>`;
          return;
        }
        view.innerHTML = `
          <h1 data-testid="form-title">Draft Form</h1>
          <label for="notes">Notes</label>
          <input id="notes" name="notes" data-testid="notes" value="${draft.notes.replace(/"/g, "&quot;")}" />
          <p id="status" data-testid="status">Route: form</p>
        `;
        const input = document.getElementById("notes");
        input.addEventListener("input", () => { draft.notes = input.value; });
      }
      window.addEventListener("hashchange", render);
      if (!location.hash) location.hash = "#/form";
      render();
    </script>
  </body>
</html>
