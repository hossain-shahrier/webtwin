<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SPA S3 — Portal Dialog</title>
    <style>
      body { font-family: Georgia, serif; margin: 2rem; background: #f3efe6; }
      .hidden { display: none !important; }
      [data-portal] {
        position: fixed; right: 1rem; bottom: 1rem; background: #fff;
        padding: 1.5rem; min-width: 18rem; box-shadow: 0 8px 24px rgba(0,0,0,.15);
      }
      label { display: block; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <div id="root">
      <h1>Offer details</h1>
      <button type="button" id="open_dialog" name="open_dialog" data-testid="open_dialog">Open dialog</button>
      <div id="bonus-group" class="hidden">
        <p id="bonus_hint" data-testid="bonus_hint">Bonus field unlocked</p>
      </div>
    </div>
    <div data-portal id="portal-root" class="hidden" role="dialog" aria-label="Bonus dialog"></div>
    <script>
      const portal = document.getElementById("portal-root");
      function mountDialog() {
        portal.classList.remove("hidden");
        portal.innerHTML = `
          <label for="bonus_code">Bonus code</label>
          <select id="bonus_code" name="bonus_code" data-testid="bonus_code">
            <option value="none">None</option>
            <option value="exec">Executive</option>
          </select>
        `;
        document.getElementById("bonus_code").addEventListener("change", (e) => {
          document.getElementById("bonus-group").classList.toggle("hidden", e.target.value !== "exec");
        });
      }
      document.getElementById("open_dialog").addEventListener("click", mountDialog);
      // Mount portal field immediately so discovery can diff value → visibility
      mountDialog();
    </script>
  </body>
</html>
